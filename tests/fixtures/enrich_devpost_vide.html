<html><head><meta name="description" content="Agents, but with taste. " /><meta property="og:description" content="Agents, but with taste. " /></head><body><section le>

      <article id="prizes">
  <div class="section-title bold">
    <h3 class="subheader section-title-left">
      Prizes
    </h3>
    <span class="section-title-line"></span>
  </div>

  <div id="prizes-overview">
    <div class="row">
      <div class="column-left text-left text-large"><span data-currency="true">$<span data-currency-value>25,000</span></span> in prizes</div>
      
    </div>
  </div>

    <div class="row">
        <div class="small-12 large-6 columns end prize" id="prize_105259">
          <h6>
            <div class="prize-title">
              <span class="ss-icon ss-standard ss-star prize-icon"></span>
              <div>
                First Place
              </div>

            </div>
          </h6>

          <div class="prize-content">
            <div class="prize-value">
              <span data-currency="true">$<span data-currency-value>15,000</span></span> in cash
            </div>

            <div class="prize-winners">
              1 winner
            </div>

            <p></p>
          </div>
        </div>
        <div class="small-12 large-6 columns end prize" id="prize_105260">
          <h6>
            <div class="prize-title">
              <span class="ss-icon ss-standard ss-star prize-icon"></span>
              <div>
                Second Place
              </div>

            </div>
          </h6>

          <div class="prize-content">
            <div class="prize-value">
              <span data-currency="true">$<span data-currency-value>6,000</span></span> in cash
            </div>

            <div class="prize-winners">
              1 winner
            </div>

            <p></p>
          </div>
        </div>
    </div>
    <div class="row">
        <div class="small-12 large-6 columns end prize" id="prize_105261">
          <h6>
            <div class="prize-title">
              <span class="ss-icon ss-standard ss-star prize-icon"></span>
              <div>
                Third Place
              </div>

            </div>
          </h6>

          <div class="prize-content">
            <div class="prize-value">
              <span data-currency="true">$<span data-currency-value>4,000</span></span> in cash
            </div>

            <div class="prize-winners">
              1 winner
            </div>

            <p></p>
          </div>
        </div>
    </div>
</article>

      <article class="hide" id="possible-achievements" data-possible-achievements>
  <div class="section-title bold">
    <h3 class="subheader section-title-left">
      Devpost Achievements
    </h3>
    <span class="section-title-line"></span>
  </div>

  <p>Submitting to this hackathon could earn you:</p>

  <div class="flex-row" data-list>
    <!-- achievement list -->
  </div>

  <script type="text/template" data-template>
    <div class="possible-achievement">
      <div class="badge left">
        <img src="<%= photos.medium %>" srcset="<%= photos.large %> 2x">
      </div>

      <div class="content">
        <h6>
          <%= name %>
        </h6>
        <% if (has_levels) { %>
          <span class="level"><i class="fas fa-arrow-up"></i> level <%= next_level %></span>
        <% } %>
      </div>
    </div>
  </script>
</article>

      
      <article id="judges">
  <div class="section-title bold">
    <h3 class="subheader section-title-left">
      Judges
    </h3>
    <span class="section-title-line"></span>
  </div></section></body></html>
