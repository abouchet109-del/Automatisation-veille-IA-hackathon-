name: Hackathon Watch

on:
  schedule:
    - cron: "0 7 * * 0,1"  # dimanche et lundi, 7 h UTC = 8 h ou 9 h à Paris
  workflow_dispatch:

permissions:
  contents: write

concurrency: hackwatch

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e .

      - name: Veille et envoi de l'email
        run: python -m hackwatch
        env:
          HACKWATCH_DB: state/hackwatch.db
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Sauvegarde de l'état anti-doublons
        if: always()
        run: |
          if [ -n "$(git status --porcelain state/hackwatch.db)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/hackwatch.db
            git commit -m "État : run du $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
